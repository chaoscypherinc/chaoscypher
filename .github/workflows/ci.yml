name: CI

# Where jobs run: the repository variable CI_RUNS_ON (a JSON label list, e.g.
# '["self-hosted","home"]' on the dev repo's home runner); unset, GitHub-hosted
# ubuntu-latest. Every CI-type workflow uses this one switch; publishing
# workflows stay hosted (OIDC trusted publishing). Pinned by
# packages/core/tests/unit/scripts/test_ci_config_guards.py.

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# A newer push cancels a superseded run: the home fleet is four runners, and a stale run holds
# them while the current one queues. On main too (2026-11-06): when several merges land together,
# only the newest commit's run goes on. Nothing reads an older main commit's own run: the merge
# train reads the tip's run and counts a cancelled one as pending, never red, and a push run
# diffs from the newest green main commit (scripts/ci_changes.py), so a cancelled run's changes
# are checked by the next. The exception is the public mirror's main, which keeps every run:
# auto-tag.yml there tags a release commit only once CI succeeded on that exact commit, and a
# cancelled run would stop the release.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.repository != 'chaoscypherinc/chaoscypher' }}

jobs:
  # Which jobs this change needs (scripts/ci_changes.py, the one detection every conditional job
  # reads). A job skipped by its `if:` concludes as skipped, which counts as passing for the run's
  # conclusion (and a required check); a workflow-level `paths-ignore` would instead leave the
  # run absent, so the merge train would wait for a CI run that never comes.
  changes:
    name: Detect what the change touches
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read # the newest green run on main, the base of a push's range
    outputs:
      code: ${{ steps.detect.outputs.code }}
      docker: ${{ steps.detect.outputs.docker }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Detect
        id: detect
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/ci_changes.py --workflow ci.yml

  # A change only to the private operations tree (internal/, outside what shipped tests read)
  # skips every job below that builds or tests what ships; this job runs the checks that read
  # that tree in their place: the secret scan, the metrics and media checks, and the
  # operations-tooling tests. The gitleaks workflow runs on every push regardless.
  internal-checks:
    name: Operations checks (internal-only changes)
    needs: changes
    if: needs.changes.outputs.code == 'false'
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.14
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          cache-dependency-glob: uv.lock

      - name: Sync workspace (frozen)
        run: uv sync --all-packages --extra dev --frozen

      - name: Secret scan, metrics and media checks, operations-tooling tests
        run: uv run python scripts/run_ci.py --steps lint-secrets,lint-internal-refs,internal-tool-tests

  python-quality:
    name: Python Quality
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    # 30 (was 20): the Architecture-rules step now runs the full lint-claude
    # sweep (rule self-tests + import-linter + semgrep + AST checker), ~7 min
    # warm on top of ruff/mypy — 20 was tight on a cold runner.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.14
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          cache-dependency-glob: uv.lock

      - name: Sync workspace (frozen)
        run: uv sync --all-packages --extra dev --frozen

      - name: Ruff lint
        run: uv run ruff check packages/

      - name: Ruff format check
        run: uv run ruff format --check packages/

      - name: Type check
        run: uv run mypy packages/core/src packages/cortex/src packages/neuron/src packages/cli/src --config-file=pyproject.toml

      - name: Architecture rules
        # Delegate to the local CI runner so all four enforcers run
        # (rule self-tests, import-linter, semgrep, AST checker) —
        # same single-source-of-truth pattern as the security job.
        run: uv run python scripts/run_ci.py --steps lint-claude

      - name: Secret scan
        # detect-secrets over the tracked tree (and gitleaks too, where installed): the engine the
        # routine sandbox and the public export gate use, so a finding fails here, on its own PR.
        run: uv run python scripts/run_ci.py --steps lint-secrets

  # The per-file test timings the shards pack by (the repo-root conftest, CI_TEST_DURATIONS):
  # restored once here and handed to every shard, so all of them pack from one record even when
  # another run saves a newer one meanwhile; shards packed from two records could run a file twice
  # or never.
  test-timings:
    name: Test timings for the shards
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 5
    steps:
      - name: Restore the latest recorded timings
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: test-durations
          key: test-durations-${{ github.run_id }}
          restore-keys: test-durations-

      # No record yet (or evicted): an empty one, and the shards pack by test count.
      - name: Make sure a record exists
        run: |
          mkdir -p test-durations
          ls test-durations/*.json >/dev/null 2>&1 || echo '{}' > test-durations/none.json

      - name: Hand the record to the shards
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-durations
          path: test-durations/
          retention-days: 1
          if-no-files-found: error

  python-tests:
    # Sharded (CI_TEST_SHARD, the repo-root conftest; the matrix list is the one place the count
    # lives): the whole suite took about 27 minutes on one 4-CPU home runner, past the timeout. Each
    # shard keeps its coverage data; python-coverage combines them and holds the 80% gate. A run's
    # wall time is its slowest shard. Four, the home fleet's size (2026-11-06; ten from 2026-11-05):
    # a run is about 20 jobs, so on four runners it queued in waves and took 40-60 minutes, and ten
    # shards were half of those jobs; a run with six shards on quiet runners took about 20. The
    # shards pack equal seconds from the recorded timings, so four fill the fleet in one wave.
    # Pinned by test_ci_config_guards.py.
    # Each shard also runs its share of the operations-tooling tests (internal-tool-tests: a no-op
    # on the public tree), which held the Public Gates job for 19 minutes on one small runner.
    name: Python Unit Tests (${{ matrix.shard }}/${{ strategy.job-total }})
    needs: [changes, test-timings]
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    # 60 (40 with ten shards): a shard ends on the recipe tests, a few of which run the retrieval
    # sample for minutes each (a known cost, tracked to be made fast), and each of four shards
    # carries two and a half times a ten-shard share, which took up to 21 minutes on the slowest
    # runner. faulthandler names any one test past five minutes, so a real hang still shows.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      CI_TEST_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
      COVERAGE_FILE: coverage-data/shard-${{ matrix.shard }}
      CI_TEST_DURATIONS: test-durations
      CI_TEST_DURATIONS_OUT: coverage-data/durations-shard-${{ matrix.shard }}.json
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Fetch the timings the shards pack by
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: test-durations
          path: test-durations

      # Some tests run the leaderboard page's TypeScript module under node (type stripping, the
      # supported floor): a runner's system node (Ubuntu's, or the hosted image's 20) cannot.
      - name: Set up Node (the supported floor)
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc

      - name: Set up Python 3.14
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          cache-dependency-glob: uv.lock

      - name: Sync workspace (frozen)
        run: uv sync --all-packages --extra dev --frozen

      # faulthandler_timeout: a test past five minutes dumps every thread's stack, so a hang names
      # itself instead of ending in a silent job timeout; --durations lists the slowest tests.
      - name: Run this shard's unit tests with coverage (xdist parallel)
        run: |
          mkdir -p coverage-data
          uv run pytest packages/core/tests packages/cortex/tests packages/cli/tests packages/neuron/tests -m "not e2e" --tb=short --import-mode=importlib \
            -n auto \
            --cov=packages/core/src/chaoscypher_core \
            --cov=packages/cortex/src/chaoscypher_cortex \
            --cov=packages/cli/src/chaoscypher_cli \
            --cov=packages/neuron/src/chaoscypher_neuron \
            --cov-report= \
            --durations=40 \
            -o faulthandler_timeout=300

      # The same CI_TEST_SHARD and record give this shard its share of each suite; each suite
      # records its own seconds beside the shard's (scripts/run_internal_tool_tests.py).
      - name: Run this shard's share of the operations-tooling tests
        run: uv run python scripts/run_ci.py --steps internal-tool-tests

      - name: Keep the shard's coverage data
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-data-${{ matrix.shard }}
          path: coverage-data/
          retention-days: 1
          if-no-files-found: error

  python-coverage:
    name: Python Coverage
    needs: [changes, python-tests]
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.14
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          cache-dependency-glob: uv.lock

      - name: Sync workspace (frozen)
        run: uv sync --all-packages --extra dev --frozen

      - name: Fetch every shard's coverage data
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: coverage-data-*
          path: coverage-data
          merge-multiple: true

      # Each shard wrote its files' seconds (the tooling suites' in files of their own); together
      # they are the next run's record.
      - name: Gather this run's test timings
        run: |
          mkdir -p test-durations
          cp coverage-data/durations-shard-*.json test-durations/

      - name: Save them for the next run's shards
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: test-durations
          key: test-durations-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Combine, gate at 80%, write Cobertura xml for diff-cover
        run: |
          uv run coverage combine coverage-data/shard-*
          uv run coverage report --fail-under=80
          uv run coverage xml -o coverage.xml

      - name: Diff coverage (advisory — >=90% on lines changed vs origin/main)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          # Need full history of the base branch so diff-cover can compute the diff.
          git fetch origin ${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }} --depth=200 || true
          uv run diff-cover coverage.xml \
            --compare-branch=origin/${{ github.base_ref }} \
            --fail-under=90 \
            --markdown-report diff-cover.md
          if [ -f diff-cover.md ]; then
            echo "## Diff coverage report" >> "$GITHUB_STEP_SUMMARY"
            cat diff-cover.md >> "$GITHUB_STEP_SUMMARY"
          fi

  frontend:
    name: Frontend (Node ${{ matrix.node }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The supported floor (24, LTS to 2028-04) and the newest release.
        node: ["24", "26"]
    defaults:
      run:
        working-directory: packages/interface
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: packages/interface/package-lock.json

      - name: Set up Python 3.14
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: npm ci

      - name: Sync backend (core + cortex needed for OpenAPI schema)
        working-directory: ${{ github.workspace }}
        run: uv sync --all-packages --frozen

      # Types must be generated before Lint/Test: src/types/generated/api.ts
      # is gitignored, so it does not exist at checkout (run_ci.py orders
      # `types` before `lint` for the same reason).
      - name: Generate OpenAPI types
        run: ../../scripts/generate-types.sh

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --run

      - name: Build
        run: npm run build

  security:
    name: Dependency Audits
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.14
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"

      - name: Set up Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: packages/interface/package-lock.json

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          cache-dependency-glob: uv.lock

      - name: Sync workspace (frozen, with dev extras for pip-audit)
        run: uv sync --all-packages --extra dev --frozen

      - name: Install frontend deps
        working-directory: packages/interface
        run: npm ci

      - name: Dependency audits (Python + frontend + docs)
        # Single source of truth: the `security` step of scripts/run_ci.py
        # (pip-audit ignore-list, interface strict high+ audit, docs
        # fixable-only gate). This job used to restate that policy inline and
        # drifted from it twice in one day (#402/#404/#405) — invoke the
        # runner instead of mirroring it.
        run: uv run python scripts/run_ci.py --steps security

  public-gates:
    name: Public Gates (internal-ref scan, license policy, docs build)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    # 25 again (2026-11-05): the operations-tooling tests that took it to 35 on 2026-10-24 (up to
    # 19 of its 28 minutes on a small runner) moved to the unit-test shards; about 8 minutes remain.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.14
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"

      - name: Set up Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          cache-dependency-glob: uv.lock

      - name: Sync workspace (frozen, with dev extras for pip-licenses)
        run: uv sync --all-packages --extra dev --frozen

      - name: Install frontend deps (the license policy reads the production tree)
        working-directory: packages/interface
        run: npm ci

      - name: Internal-ref scan, license policy, docs build
        # Single source of truth: the same three steps of scripts/run_ci.py the
        # pre-push gate runs, invoked instead of mirrored (the `security` job's
        # pattern). Until 2026-09-28 public CI ran none of them although
        # chaoscypher.com deploys from this tree's packages/docs, so a Docusaurus
        # break passed CI green and surfaced as a site outage (#609 D3). The
        # metrics/media checks inside lint-internal-refs no-op when internal/
        # is absent, which it is on the public tree. The operations-tooling
        # tests, part of lint-internal-refs until 2026-11-05, are the
        # internal-tool-tests step, which the unit-test shards share out.
        run: uv run python scripts/run_ci.py --steps lint-internal-refs,license-check,docs-build

  remaining-gates:
    name: Remaining gates (docstrings, dead code, bundle size, generated docs, CLI e2e)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.14
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"

      - name: Set up Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: packages/interface/package-lock.json

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          cache-dependency-glob: uv.lock

      - name: Sync workspace (frozen, with dev extras)
        run: uv sync --all-packages --extra dev --frozen

      - name: Install frontend deps
        working-directory: packages/interface
        run: npm ci

      - name: The run_ci steps no other job runs
        # Single source of truth, as the security and public-gates jobs: these steps were in the
        # pre-push gate only until 2026-10-15, when it became a fast tier and this job took them
        # (test_run_ci_plan pins that every step of the full local plan runs somewhere in CI).
        run: uv run python scripts/run_ci.py --steps types,docstrings,deadcode,bundle-size,docs-generated,e2e-cli

  docker-image:
    name: Production Image Build (image-relevant changes only)
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build the production image
        # The `docker-image-build` step of scripts/run_ci.py, which is in no
        # default plan because the routine sandbox has no Docker daemon — so a
        # Dockerfile digest bump (Dependabot, weekly) could only ever be verified
        # by a human build (#673; ruled 2026-09-28: build it here, mechanically).
        # Runs only when the changes job finds an image-relevant path (its DOCKER
        # pattern). run_ci.py is stdlib-only, so no workspace sync is needed.
        run: python3 scripts/run_ci.py --steps docker-image-build
