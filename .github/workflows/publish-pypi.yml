# Publishes the four Python packages (core, cortex, neuron, cli) to PyPI.
#
# Triggers:
#   - a pushed vX.Y.Z tag -> publishes all four to REAL PyPI at the release
#     version. A guard first verifies the tag matches the package versions.
#     This is the same tag that publishes the GHCR image, so
#     `pip install chaoscypher-core==X.Y.Z` matches `ghcr.io/...:X.Y.Z`.
#     (Since 2026-09-04 the tag push is the release act; release.yml writes
#     the GitHub Release notes, and `gh release create vX.Y.Z` — which creates
#     the tag — publishes once too.)
#   - manual workflow_dispatch -> defaults to TestPyPI for a rehearsal run;
#     set target=pypi for an out-of-band real publish.
#
# Auth is PyPI Trusted Publishing (OIDC) — no long-lived API tokens. One-time
# setup per index (pypi.org and test.pypi.org), BEFORE the first run:
#   For each of chaoscypher-core / chaoscypher-cortex / chaoscypher-neuron /
#   chaoscypher-cli, add a "pending publisher" under Account > Publishing:
#     owner: chaoscypherinc   repository: chaoscypher
#     workflow: publish-pypi.yml
#     environment: <target>-<short name>, e.g. pypi-core / testpypi-core
#   One environment PER PACKAGE is required: PyPI pending publishers are
#   unique on (owner, repo, workflow, environment) — the project name is NOT
#   part of the key, so four packages sharing one environment collide and the
#   second registration fails (surfaced as a generic 500; see
#   pypi/warehouse#16920). The publish matrix below gives each package its
#   own environment so each tuple is distinct.
#   The first successful publish creates the project and converts the pending
#   publisher into its trusted publisher.
#
# Provenance: the upload step is pypa/gh-action-pypi-publish with PEP 740
# attestations on, so every file carries a Sigstore-signed statement that this
# workflow on chaoscypherinc/chaoscypher built it (pypi.org shows it under
# "Provenance"; `pypi_stats.py --wait-version` fails a release without it).
# `uv publish` uploads no attestations: v0.3.0 shipped without them and an
# automated scanner listed chaoscypher-cli/-neuron 0.3.0 as malicious (#825)
# with nothing on PyPI to show where the files came from. The action stays at
# v1.14.3 or later: up to v1.14.2 it trusted a revoked CA for Trusted
# Publishing and Sigstore (GHSA-5xjx-3w67-w9x9). Pinned by
# packages/core/tests/unit/scripts/test_ci_config_guards.py.
#
# Local equivalent (manual fallback, needs an API token; uploads no
# attestations, so use it only when the workflow cannot run):
#   uv build --package <name> -o dist && uv publish --token <token> dist/*
name: Publish to PyPI

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]  # final releases only — a pre-release tag (v0.5.0-rc1) must never repoint :latest or publish to PyPI (#530 § 3)
  workflow_dispatch:
    inputs:
      target:
        description: "Index to publish to. Use testpypi for a rehearsal run. (A vX.Y.Z tag push always targets pypi.)"
        type: choice
        options:
          - testpypi
          - pypi
        default: testpypi

permissions:
  contents: read

concurrency:
  group: publish-pypi
  cancel-in-progress: false

jobs:
  build:
    name: Build sdists and wheels
    # Publishing runs on the public mirror only: the dev repo receives the same tags (2026-10-15).
    if: github.repository == 'chaoscypherinc/chaoscypher'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Verify tag matches package versions
        if: github.event_name == 'push'
        run: python3 scripts/check_release_version.py "${{ github.ref_name }}"

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6

      - name: Build packages
        run: |
          for pkg in chaoscypher-core chaoscypher-cortex chaoscypher-neuron chaoscypher-cli; do
            uv build --package "$pkg" -o dist
          done
          ls -l dist

      - name: Validate metadata (twine check)
        run: uvx twine check --strict dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish ${{ matrix.package }} to ${{ inputs.target || 'pypi' }}
    needs: build
    # Publishing runs on the public mirror only: the dev repo receives the same tags (2026-10-15).
    if: github.repository == 'chaoscypherinc/chaoscypher'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # Independent projects — one package failing auth must not stop the rest.
      fail-fast: false
      matrix:
        include:
          - package: chaoscypher-core
            short: core
          - package: chaoscypher-cortex
            short: cortex
          - package: chaoscypher-neuron
            short: neuron
          - package: chaoscypher-cli
            short: cli
    # One environment per package — must match each PyPI pending publisher's
    # registered environment exactly (see header note on uniqueness). A tag
    # push has no `target` input, so it resolves to `pypi`.
    environment: ${{ inputs.target || 'pypi' }}-${{ matrix.short }}
    permissions:
      # Required for PyPI Trusted Publishing (OIDC token exchange).
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/

      - name: Stage ${{ matrix.package }}
        run: |
          # The publish action uploads a whole directory; give it only this
          # package's sdist and wheel (filenames use the underscored name).
          mkdir upload
          mv "dist/$(echo '${{ matrix.package }}' | tr '-' '_')-"* upload/
          ls -l upload

      - name: Publish ${{ matrix.package }}
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: upload/
          repository-url: ${{ (inputs.target || 'pypi') == 'testpypi' && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}
          # A re-run after a partial upload skips the files already there.
          skip-existing: true
          # PEP 740 provenance (#825). The action's default, stated so a
          # default change upstream cannot drop it silently.
          attestations: true

      - name: Publish status
        run: |
          echo "Published ${{ matrix.package }} to ${{ inputs.target || 'pypi' }} with PEP 740 attestations:" >> "$GITHUB_STEP_SUMMARY"
          ls upload/ >> "$GITHUB_STEP_SUMMARY"
