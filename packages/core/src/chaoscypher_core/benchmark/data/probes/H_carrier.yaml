# Each probe here is an existing probe's passage spliced into a REAL extraction
# group (war_and_peace_tiny through the real chunker), so the model meets the
# instruction at production density: 20-35 competing names, cross-sentence
# links, room to run away. Same instruction, same targeted checks, plus
# carrier_coverage (the chunk's own people must still be found) and
# no_invention (nothing outside probe + carrier may appear). Global counts
# (entity_count, relationship_count) are dropped because the carrier adds its
# own entities; the targeted checks carry the verdict.
