# ChaosCypher Instruction-Probe Benchmark
#
# Pass/fail probes: does the model follow each instruction in the extraction
# prompt, first in isolation and then inside production-sized chunks
# (section H, the carrier tier)? Same extractors as the extraction config;
# use --local-only for the published local leaderboard. Results feed
# scripts/benchmark/export_leaderboard.py -> the /leaderboard page.
#
# Pinned by the probe dataset, not by this file: thinking OFF (extraction is
# instruct work; thinking measured slower and worse on the structured output,
# 2026-09-23), temperature 0, seed 42, single shot, completion gate. The chat
# column, when it lands, runs thinking ON because that is how the product uses
# chat models. See docs/reference/extraction-benchmark "How the benchmark is
# configured, and why".
name: "ChaosCypher Instruction Probes"
description: "Pass/fail instruction probes through the real extraction pipeline, isolated and at production density."

seed: 42
temperature: 0.0

datasets:
  - probes

extractors:
  # --- Anthropic ---
  - provider: anthropic
    model: claude-opus-4-8
    label: "Claude Opus 4.8"

  - provider: anthropic
    model: claude-sonnet-4-6
    label: "Claude Sonnet 4.6"

  - provider: anthropic
    model: claude-haiku-4-5
    label: "Claude Haiku 4.5"

  # --- OpenAI ---
  - provider: openai
    model: gpt-4o
    label: "GPT-4o"

  - provider: openai
    model: gpt-4o-mini
    label: "GPT-4o Mini"

  # --- Google Gemini ---
  - provider: gemini
    model: gemini-2.5-pro
    label: "Gemini 2.5 Pro"

  - provider: gemini
    model: gemini-2.5-flash
    label: "Gemini 2.5 Flash"

  # --- Local (Ollama, ≤32 GB) ---
  - provider: ollama
    model: "gemma4:12b"
    label: "Gemma 4 12B (local)"

  - provider: ollama
    model: "gemma4:26b"
    label: "Gemma 4 26B (local)"

  - provider: ollama
    model: "qwen3:8b"
    label: "Qwen3 8B (local)"

  - provider: ollama
    model: "qwen3:14b"
    label: "Qwen3 14B (local)"

  - provider: ollama
    model: "qwen3:30b-instruct"
    label: "Qwen3 30B Instruct (local)"

  - provider: ollama
    model: "qwen3.5:27b"
    label: "Qwen3.5 27B (local)"

  - provider: ollama
    model: "qwen3.6:27b"
    label: "Qwen3.6 27B (local)"

  - provider: ollama
    model: "qwen3.6:35b-a3b"
    label: "Qwen3.6 35B-A3B MoE (local)"

  - provider: ollama
    model: "qwen3.8:27b"
    label: "Qwen3.8 27B (local)"

  - provider: ollama
    model: "gpt-oss:20b"
    label: "GPT-OSS 20B (local)"

  - provider: ollama
    model: "glm4:9b"
    label: "GLM4 9B (local)"
  - provider: ollama
    model: "phi4:14b"
    label: "Phi-4 14B (local)"

  - provider: ollama
    model: "qwen2.5:14b-instruct"
    label: "Qwen2.5 14B Instruct (local)"

  - provider: ollama
    model: "mistral-small3.2:24b"
    label: "Mistral Small 3.2 24B (local)"

  - provider: ollama
    model: "deepseek-r1:14b"
    label: "DeepSeek-R1 14B (local)"

  - provider: ollama
    model: "llama3.1:8b"
    label: "Llama 3.1 8B (local)"


  - provider: ollama
    model: "gemma4:31b"
    label: "Gemma 4 31B (local)"

  - provider: ollama
    model: "glm-4.7-flash"
    label: "GLM 4.7 Flash (local)"

  - provider: ollama
