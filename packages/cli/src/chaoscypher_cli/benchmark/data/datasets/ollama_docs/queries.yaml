# Grounded-chat probes over Ollama's documentation, release v0.40.8 (71 pages,
# ~242k characters), taken whole so the questions cover every page.
#
# The benchmark's second corpus. Same bands, counts and schema as Book One's
# fixture (war_and_peace_book1/queries.yaml; read its header for the scoring
# conventions, which apply here unchanged), so per-band numbers compare
# across the two corpora. Written 2026-10-22 from the corpus text alone,
# before any model answered any question: no question, term, alias or wrong
# fact here was chosen, kept or dropped by looking at a model's answer or at
# which retrieval rung wins it.
#
# Conventions specific to a manual:
# - pages: the page paths (the corpus's "Page: <path>" lines, which
#   internal/benchmarks/tools/build_docs_corpus.py --pages prints) each
#   question rests on. Every one of the 71 pages is the source of at least
#   one question across this file and the holdout
#   (internal/benchmarks/holdout/ollama_docs-holdout.yaml); a test pins it.
#   The loader ignores the key, so it moves no score and no recipe.
# - answer_terms: as in Book One, the most specific words a correct concise
#   answer names, never the question's own subject. Every member of every
#   alias group is a phrase of the corpus (case and accents folded, curly
#   apostrophes and typographic hyphens straightened, as the scorer reads
#   it); at least one member of each group is on one line of the raw text,
#   so the retrieval tools' reading (context_holds_terms) finds it. A
#   setting, endpoint or flag that the loose single-word rule would split
#   ('/api/generate' is met by 'generate', '--level' by 'level') is written
#   as an alias group, which matches only as a whole phrase.
# - must_not_contain: the tempting wrong statement (the neighbouring
#   variable, the swapped default, the other page's number), written as a
#   model would state it; a decline or a contrast that negates it states
#   nothing (scorer v7).
# - fine_grained_discrimination: gold_entities and wrong_entities are two
#   settings, flags or endpoints the text keeps apart, with no shared word.
# - out_of_scope: plausible questions about Ollama that these pages do not
#   answer, several of them false-premise traps (a feature, a variable or a
#   number the docs never give, often one a model remembers from elsewhere).
#   decoy_entities never occur in the corpus (a test guards it); where the
#   trap is a fact the corpus does state for something else, the wrong
#   statement is a must_not_contain phrase instead.
# - Numbers in gold answers are written as the text writes them.
# - Verification pass (2026-10-22, after writing, before any model run):
#   every entry re-read adversarially against the corpus (is the gold what
#   the text says, can a right answer fail the terms, can a wrong one pass
#   them, can a right answer state a must_not_contain phrase), with 438
#   hand-written right and wrong answers scored by the real checks against
#   the whole corpus, and the shared fixture guards. It changed 20 entries:
#   q004 q006 q011 q025 q032 q034 q040 q043 q045 q064 q082 q085 q086 q091
#   q097 q099 q100 q113 q114 q117 (notes on each; q034 and q085 gained the
#   'v0.x' form the text writes, q082's second term became a phrase on one
#   raw line, q086's wrong fact lost its 'x-' prefix with q043's term). No real model answer
#   exists yet: the first campaign's answers are to be judged exhaustively,
#   as Book One's were, before any conclusion rests on this file.
# - paraphrases: the answer-term members a right answer writes that the text
#   does not (a contraction, "doesn't overwrite" for "does not overwrite"; a
#   thousands separator, "4,096"; a unit without its space, "8gb"; a synonym,
#   "last chunk" for "final chunk"). The scorer matches a member whole, so
#   such a spelling must be a member; each listed one sits in a group with a
#   member the text writes (the group stays grounded), and the fixture test
#   checks both. The loader ignores the key, as it ignores pages.
# - Review 2026-10-22 (an independent adversarial pass, before any model
#   run): every entry re-read against the corpus, 297 hand-written right and
#   wrong answers over 73 entries scored by the real checks against the whole
#   corpus (internal/benchmarks/tools/tests/ollama_docs_answer_probes.json,
#   pinned by test_ollama_docs_answer_probes.py). It changed 40 entries here
#   (each carries a "Review 2026-10-22" note): right answers that failed the
#   terms (contractions, digit grouping, units, the text's other way to do a
#   thing), wrong answers that passed (swapped pairs in other words, a "yes"
#   beside the right recommendation), wrong facts a right answer states
#   (q012, q050, q058), two questions with a second defensible answer (q036,
#   q086), four graph questions one page answered (q093, q094, q095, q098)
#   and two that quoted the text (q051, q060). Scorer limits it found are in
#   internal/TODO.md and the probe test's KNOWN_LIMITS. A second pass the
#   same day ("Review 2026-10-22 (second pass)") gave the last five
#   relationship_path questions that one page answered (q092, q096, q097,
#   q099, q100) a second page each; the probes now number 318 over 77
#   entries.
# - wrong_members and holders (Review 2026-10-23, answers, round 3; chat
#   scorer v8): for a list question, the members its gold leaves out as an
#   answer names them (the guide that confirms an "API Host", the platform
#   only one tool has); no_wrong_members fails an answer that lists one beside
#   a gold member. For a "which do both have" question, holders are the two
#   entities, so a clause or list about one of them ("OpenClaw also has
#   iMessage") is that one's own list. Each is a phrase of the corpus and no
#   answer-term member (the fixture test checks both); the answer probes
#   gained q103 and three q110 answers for it.
version: "1.0"
queries:

# ── FACTUAL SINGLE HOP ──────────────────────────────────────────────────────

  - id: q001
    band: factual_single_hop
    question: "By default, on which address and port does the Ollama server listen?"
    pages: [faq]
    gold_entities: ["OLLAMA_HOST", "127.0.0.1", "11434"]
    answer_terms: [["127.0.0.1", "localhost"], "11434"]
    must_not_contain: ["binds 0.0.0.0 by default", "binds to 0.0.0.0 by default", "listens on 0.0.0.0 by default", "port 8080"]
    gold_answer: |
      It binds 127.0.0.1 port 11434 by default; OLLAMA_HOST changes the bind
      address.

  - id: q002
    band: factual_single_hop
    question: "What is the oldest version of macOS that Ollama supports?"
    pages: [macos]
    gold_entities: ["macOS Sonoma"]
    # Review 2026-10-22: a right answer may name the version alone ("macOS 14 or newer"); a paraphrase, listed.
    answer_terms: [["Sonoma", "v14", "macOS 14"]]
    paraphrases: ["macOS 14"]
    must_not_contain: ["Ventura or newer", "Monterey or newer", "Big Sur or newer"]
    gold_answer: |
      macOS Sonoma (v14) or newer.

  - id: q003
    band: factual_single_hop
    question: "What is the default value of the temperature parameter?"
    pages: [modelfile]
    gold_entities: ["temperature"]
    answer_terms: ["0.8"]
    # the Modelfile example sets 1 and the table's usage column shows 0.7
    must_not_contain: ["default is 0.7", "default of 0.7", "defaults to 0.7", "default temperature is 1", "defaults to 1.0"]
    gold_answer: |
      0.8.

  - id: q004
    band: factual_single_hop
    question: "How many results does Ollama's web search API return by default, and what is the most you can ask for?"
    pages: [capabilities/web-search]
    gold_entities: ["max_results"]
    # Verification 2026-10-22 (adversarial answer probes): the numbers in words are the same tokens to the scorer.
    answer_terms: [["5", "five"], ["10", "ten"]]
    # the swapped pair would meet both terms
    # Review 2026-10-23 (answers): "maximum of 5" caught the right "returns a maximum of 5 results by default, up to 10";
    # the swapped pair is caught on its default side instead ("10 by default", "default 10" added).
    must_not_contain: ["default of 10", "defaults to 10", "default is 10", "default of ten", "default 10", "10 by default", "10 results by default", "ten by default", "ten results by default", "default value of 10", "default value is 10"]
    gold_answer: |
      5 by default; max_results can be raised to at most 10.

  - id: q005
    band: factual_single_hop
    question: "According to the embeddings guide, what vector lengths do embedding models typically produce?"
    pages: [capabilities/embeddings]
    gold_entities: ["embeddings"]
    # Review 2026-10-22: "1,024 dimensions" (thousands separator) failed the term the text writes "1024".
    answer_terms: ["384", ["1024", "1,024"]]
    paraphrases: ["1,024"]
    must_not_contain: ["up to 4096 dimensions", "always 768 dimensions"]
    gold_answer: |
      Typically 384 to 1024 dimensions; the length depends on the model.

  - id: q006
    band: factual_single_hop
    question: "Which tag of the Ollama Docker image does the Docker guide use for AMD GPUs with ROCm?"
    pages: [docker]
    gold_entities: ["ollama/ollama:rocm"]
    answer_terms: [["ollama/ollama:rocm", "rocm tag"]]
    # Verification 2026-10-22 (adversarial answer probes): 'rocm tag' was met by "there is no special ROCm tag".
    must_not_contain: ["ollama/ollama:amd", "ollama/ollama:latest for AMD", "no special ROCm tag", "no ROCm tag", "no separate ROCm tag"]
    gold_answer: |
      The rocm tag: ollama/ollama:rocm, run with --device /dev/kfd and
      --device /dev/dri.

  - id: q007
    band: factual_single_hop
    question: "Who builds Hermes Agent?"
    pages: [integrations/hermes]
    gold_entities: ["Nous Research"]
    answer_terms: [["Nous Research", "Nous"]]
    must_not_contain: ["built by Anthropic", "built by OpenAI", "built by Ollama"]
    gold_answer: |
      Nous Research.

  - id: q008
    band: factual_single_hop
    question: "Which core tools does the Pi coding agent ship with before any extensions are added?"
    pages: [integrations/pi]
    gold_entities: ["Pi"]
    answer_terms: ["read", "write", "edit", "bash"]
    gold_answer: |
      Four: read, write, edit and bash; everything else comes through
      extensions.

  - id: q009
    band: factual_single_hop
    question: "Where does the documentation's home page invite users to join the community conversation?"
    pages: [index]
    gold_entities: ["Discord", "Reddit"]
    answer_terms: ["Discord", "Reddit"]
    # Review 2026-10-23 (answers): the index page's Community section ends one chunk before the "# Quickstart" heading; an answer
    # that names Discord and Reddit but denies the home page carries the invitation states the asked fact wrong.
    must_not_contain: ["on Slack", "GitHub Discussions", "home page does not", "index page does not", "page does not list", "not part of the home page", "not on the home page"]
    gold_answer: |
      On Discord or Reddit.

  - id: q010
    band: factual_single_hop
    question: "Which request field gives you structured outputs through the OpenAI-compatible API?"
    pages: [capabilities/structured-outputs, api/openai-compatibility]
    gold_entities: ["response_format"]
    answer_terms: ["response_format"]
    gold_answer: |
      response_format (the native API uses the format field instead).

  - id: q011
    band: factual_single_hop
    question: "In the quickstart's local example, about how large is the Gemma 4 E2B download, and how much VRAM is recommended?"
    pages: [quickstart]
    gold_entities: ["gemma4:e2b"]
    # Review 2026-10-22: "7.2GB" and "8GB" (no space) failed both terms.
    answer_terms: [["7.2 GB", "7.2gb"], ["8 GB", "8gb"]]
    paraphrases: ["7.2gb", "8gb"]
    # 9.6 GB is gemma4:latest's size in the context-length page's ollama ps example
    # Verification 2026-10-22 (adversarial answer probes): the swapped pair met both terms.
    must_not_contain: ["download is about 9.6 GB", "9.6 GB download", "8 GB download", "7.2 GB VRAM", "7.2 GB of VRAM", "7.2 GB of available VRAM"]
    gold_answer: |
      About 7.2 GB; 8 GB of available VRAM (or unified memory on a Mac) is
      recommended.

  - id: q012
    band: factual_single_hop
    question: "What is the minimum RAM for running NemoClaw?"
    pages: [integrations/nemoclaw]
    gold_entities: ["NemoClaw"]
    # Review 2026-10-22: "8GB" failed the term; "at least 16 GB" is what a right answer says of the recommendation
    # ("8 GB minimum, at least 16 GB recommended"), and a wrong answer without 8 GB already fails the term.
    answer_terms: [["8 GB", "8gb"]]
    paraphrases: ["8gb"]
    # Review 2026-10-23 (answers): the 8 GB minimum is NemoClaw's own requirement; an answer that infers it
    # "based on Ollama's requirements" (the 8 GB VRAM recommendation) attaches it to the wrong thing.
    must_not_contain: ["minimum of 16 GB", "16 GB minimum", "requires 16 GB", "based on Ollama's requirements", "based on the requirements for Ollama"]
    gold_answer: |
      8 GB minimum (16 GB recommended).

  - id: q013
    band: factual_single_hop
    question: "Which anthropic-version header value should requests to Ollama's hosted Anthropic-compatible endpoint send?"
    pages: [api/anthropic-compatibility]
    gold_entities: ["anthropic-version"]
    # a group: the loose rule would accept any '2023'
    answer_terms: [["2023-06-01"]]
    must_not_contain: ["2023-01-01", "2024-06-01"]
    gold_answer: |
      2023-06-01; the hosted endpoint rejects older values.

  - id: q014
    band: factual_single_hop
    question: "Under what name was OpenClaw previously known?"
    pages: [integrations/openclaw]
    gold_entities: ["Clawdbot"]
    answer_terms: ["Clawdbot"]
    must_not_contain: ["Moltbot"]
    gold_answer: |
      Clawdbot; ollama launch clawdbot still works as an alias.

  - id: q015
    band: factual_single_hop
    question: "When you call the REST API directly with images, in what form must the image data be?"
    pages: [capabilities/vision]
    gold_entities: ["images"]
    answer_terms: ["base64"]
    must_not_contain: ["REST API accepts file paths", "REST API accepts URLs", "REST API accepts image URLs"]
    gold_answer: |
      Base64-encoded image data in the images array; the SDKs also accept
      file paths, URLs or raw bytes.

# ── PARAPHRASE ──────────────────────────────────────────────────────────────

  - id: q016
    band: paraphrase
    question: "I want Ollama to stay strictly on my machine, with no hosted models and no web search. What do I set?"
    pages: [faq]
    gold_entities: ["disable_ollama_cloud", "OLLAMA_NO_CLOUD"]
    answer_terms: [["disable_ollama_cloud", "OLLAMA_NO_CLOUD"]]
    must_not_contain: ["OLLAMA_OFFLINE"]
    gold_answer: |
      Turn off the cloud features: set disable_ollama_cloud to true in
      ~/.ollama/server.json, or OLLAMA_NO_CLOUD=1, and restart Ollama.

  - id: q017
    band: paraphrase
    question: "How do I point Xcode's coding assistant at the Ollama running on my Mac?"
    pages: [integrations/xcode]
    gold_entities: ["Xcode"]
    answer_terms: [["Locally Hosted"], "11434"]
    # Review 2026-10-23 (answers): 'Use custom base URL' is the neighbouring integration page's setting
    # (Roo Code's ollama.com steps), never an Xcode step; an answer that adds it gives the wrong procedure.
    must_not_contain: ["select Internet Hosted and enter port 11434", "Use custom base URL"]
    gold_answer: |
      In Xcode's Settings select Locally Hosted, enter port 11434 and click
      Add, then choose the model under My Account.

  - id: q018
    band: paraphrase
    question: "I'd like to hook Poolside's terminal agent up to my local Ollama by hand rather than through the launcher. What do I export?"
    pages: [integrations/pool]
    gold_entities: ["Pool"]
    # Review 2026-10-23 (answers): the base URL's value is asked too ("what do I export"); the two names alone,
    # or the URL without /v1, passed. The value is a third term, matched whole (127.0.0.1 for localhost).
    answer_terms: ["POOLSIDE_STANDALONE_BASE_URL", "POOLSIDE_API_KEY", ["localhost:11434/v1", "127.0.0.1:11434/v1"]]
    gold_answer: |
      POOLSIDE_STANDALONE_BASE_URL set to http://localhost:11434/v1 and
      POOLSIDE_API_KEY set to ollama, then run pool -m with the model.

  - id: q019
    band: paraphrase
    question: "After my function has run, how do I hand its output back to the model in the conversation?"
    pages: [capabilities/tool-calling]
    gold_entities: ["tool calling"]
    # Review 2026-10-22: a right answer that sends a message with role "tool" and the result, without naming
    # tool_name, failed; the role is the text's other marker of a tool result (role: tool).
    # Review 2026-10-23 (answers): the role as answers write it (the code's role: 'tool', "a role of 'tool'", "role set to
    # 'tool'", a "tool message"/"tool role" message) failed the group; and passing the output back in tool_calls is wrong.
    answer_terms: [["tool_name", "role: tool", "role: 'tool'", "role 'tool'", "role tool", "role of 'tool'", "role of tool", "role set to 'tool'", "role set to tool", "tool message", "tool role"]]
    paraphrases: ["role 'tool'", "role tool", "role of 'tool'", "role of tool", "role set to 'tool'", "role set to tool", "tool message", "tool role"]
    must_not_contain: ["use the tool_calls field", "via the tool_calls field", "through the tool_calls field"]
    gold_answer: |
      Append a message with role tool, the tool_name and the result as its
      content, then send the updated messages to chat again.

  - id: q020
    band: paraphrase
    question: "With the Python library my chat call returns everything at once, yet my curl request streamed. How do I make the library stream?"
    pages: [capabilities/streaming]
    gold_entities: ["stream"]
    # Review 2026-10-22: "set stream to True" failed every alias.
    answer_terms: [["stream=True", "stream: true", "stream parameter to True", "stream to true"]]
    paraphrases: ["stream to true"]
    gold_answer: |
      Set stream=True: streaming is enabled by default in the REST API but
      disabled by default in the SDKs.

  - id: q021
    band: paraphrase
    question: "How can my app learn which reasoning levels a model accepts, and which one it uses if I don't ask for one?"
    pages: [capabilities/thinking, api/post-api-show]
    gold_entities: ["/api/show"]
    answer_terms: [["/api/show", "api/show"], "default"]
    gold_answer: |
      Call /api/show: its thinking object lists the supported values and
      the default used when think is not set.

  - id: q022
    band: paraphrase
    question: "If I start OpenCode through ollama launch, what happens to the settings in my own opencode.json?"
    pages: [integrations/opencode]
    gold_entities: ["OpenCode"]
    # Review 2026-10-22: "it doesn't overwrite your opencode.json" (a contraction) failed every alias.
    # Review 2026-10-23 (answers): the passive "settings are not overwritten" (four right answers) failed
    # every alias; a paraphrase, listed.
    answer_terms: [["does not overwrite", "doesn't overwrite", "won't overwrite", "not overwritten", "inline config", "still apply"]]
    paraphrases: ["doesn't overwrite", "won't overwrite", "not overwritten"]
    must_not_contain: ["overwrites your opencode.json", "replaces your opencode.json", "overwrites ~/.config/opencode/opencode.json"]
    gold_answer: |
      Nothing changes: ollama launch opencode starts OpenCode with an inline
      config for the chosen model and does not overwrite
      ~/.config/opencode/opencode.json, so existing settings still apply.

  - id: q023
    band: paraphrase
    question: "I have a full-precision GGUF file. Will Ollama shrink it to a smaller quantization when I import it?"
    pages: [import]
    gold_entities: ["GGUF"]
    # Review 2026-10-22: "No, Ollama doesn't quantize GGUF on import" failed both aliases.
    answer_terms: [["does not quantize", "doesn't quantize", "won't quantize", "llama-quantize"]]
    paraphrases: ["doesn't quantize", "won't quantize"]
    # Review 2026-10-23 (answers): "won't shrink it unless explicitly instructed to" is a conditional yes the text
    # denies for GGUF (a wrong fact); "the docs do not say it will shrink it" notes the premise and is no decline.
    must_not_contain: ["quantizes it during import", "Ollama quantizes GGUF", "!unless explicitly instructed", "!unless instructed to"]
    caveats: ["automatically shrink"]
    gold_answer: |
      No. Ollama does not quantize GGUF models during import; quantize it
      first with a GGUF tool such as llama.cpp's llama-quantize.

  - id: q024
    band: paraphrase
    question: "Can I create or delete models by calling the hosted API on ollama.com directly?"
    pages: [api/introduction]
    gold_entities: ["local Ollama server"]
    # Review 2026-10-22: "No, that needs your local Ollama" failed every alias.
    answer_terms: [["requires a local Ollama server", "local Ollama server", "local server", "local Ollama"]]
    # Review 2026-10-23 (answers): "Yes, you can create or delete models ..." quotes the local-server line and still
    # answers yes; it met the term and no trap. The yes is the wrong statement.
    must_not_contain: ["can create models on ollama.com", "ollama.com supports creating models", "yes, you can create"]
    gold_answer: |
      No: creating or deleting models requires a local Ollama server.

  - id: q025
    band: paraphrase
    question: "If something goes wrong halfway through a streamed reply, will the HTTP status code show it?"
    pages: [api/errors]
    gold_entities: ["error"]
    # Verification 2026-10-22 (adversarial answer probes): "it stays 200, the error comes in the stream" failed; the
    # status the stream started with is the text's 200 Success, and the changed status is the wrong fact.
    # Review 2026-10-22: "No, the status code doesn't change" failed every alias; "Yes, it returns HTTP 500 with an
    # error property" passed, so the plain 500 claims are wrong facts too.
    # Review 2026-10-23 (answers): "the status code is not changed / stays the same / remains unchanged / is not
    # updated" failed every alias (paraphrases added); "Yes, ... will not be changed" answered the yes/no wrongly and passed.
    answer_terms: [["not be changed", "does not change", "doesn't change", "won't change", "already started", "error property", "200", "not changed", "unchanged", "stays the same", "remains the same", "not updated", "not altered"]]
    paraphrases: ["doesn't change", "won't change", "not changed", "unchanged", "stays the same", "remains the same", "not updated", "not altered"]
    must_not_contain: ["status changes to 500", "changes to 500", "changes from 200", "becomes 500", "returns a 500 status code mid-stream", "returns HTTP 500", "returns a 500", "status code changes", "Yes, if", "Yes, the", "Yes, it", "Yes it will", "Yes, when"]
    gold_answer: |
      It will not: the response has already started, so the status code is
      not changed; the error arrives in the application/x-ndjson stream as an
      object with an error property.

# ── MULTI HOP ───────────────────────────────────────────────────────────────

  - id: q026
    band: multi_hop
    question: "Under heavy load some requests come back with a 503. What does that mean, which variable controls it, and what is its default?"
    pages: [faq]
    gold_entities: ["OLLAMA_MAX_QUEUE"]
    answer_terms: ["OLLAMA_MAX_QUEUE", "512"]
    must_not_contain: ["OLLAMA_NUM_PARALLEL controls the queue", "default is 1024"]
    # Review 2026-10-23 (answers): "the server is overloaded and unable to process the request" explains the 503;
    # its "unable to" was read as a bare decline. A sentence naming that phrase is the answer, not a decline.
    caveats: ["unable to process"]
    gold_answer: |
      The server is overloaded and its queue is full; OLLAMA_MAX_QUEUE sets
      how many requests may be queued, and the default is 512.

  - id: q027
    band: multi_hop
    question: "If a model with a 2K context serves 4 parallel requests, what context does Ollama allocate, and which variable sets the number of parallel requests?"
    pages: [faq]
    gold_entities: ["OLLAMA_NUM_PARALLEL"]
    # Review 2026-10-22: "8,192" failed the term.
    answer_terms: [["8K", "8192", "8,192"], "OLLAMA_NUM_PARALLEL"]
    paraphrases: ["8,192"]
    must_not_contain: ["allocates 16K", "a 16K context"]
    gold_answer: |
      An 8K context, with the extra memory that takes; OLLAMA_NUM_PARALLEL
      sets the parallel requests per model (default 1).

  - id: q028
    band: multi_hop
    question: "On Linux with the systemd service, how do you give Ollama an environment variable, and where does it keep models by default?"
    pages: [faq, linux]
    gold_entities: ["systemctl", "/usr/share/ollama/.ollama/models"]
    # Review 2026-10-22: the Linux page also offers an override file at
    # /etc/systemd/system/ollama.service.d/override.conf; that right answer failed the first term.
    # Review 2026-10-23 (answers): the Linux page's Customizing section says "edit the systemd service file";
    # "edit the systemd service file and add an Environment line under [Service]" failed the first term.
    answer_terms: [["systemctl edit", "override.conf", "systemd service file"], ["/usr/share/ollama/.ollama/models"]]
    must_not_contain: ["models are stored in ~/.ollama/models on Linux"]
    gold_answer: |
      Run systemctl edit ollama.service, add an Environment line under
      [Service], then daemon-reload and restart; models are kept in
      /usr/share/ollama/.ollama/models.

  - id: q029
    band: multi_hop
    question: "Which variable limits Ollama to some of your NVIDIA GPUs, and how do you make it ignore them and run on the CPU?"
    pages: [gpu]
    gold_entities: ["CUDA_VISIBLE_DEVICES"]
