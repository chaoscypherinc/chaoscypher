# ── HARDER PROBES (2026-09-25) ───────────────────────────────────────────────
# Added after a 21-model sweep saturated q001-q050 (seven models at 50/50).
# must_not_contain holds a wrong fact a correct answer has no reason to state:
# the famous wrong year, or the answer a wrong join between two facts gives.
# It is matched as a whole phrase, so each term is the wrong fact itself.

# ── FACTUAL SINGLE HOP: traps ────────────────────────────────────────────────

  - id: q051
    band: factual_single_hop
    question: "What was the full name of NCP, the ARPANET's first host-to-host protocol?"
    gold_entities: ["NCP", "Network Working Group"]
    # answer_terms: 'Program' is the word that separates the corpus's name from the familiar one
    answer_terms: ["Program"]
    # must_not_contain: world knowledge expands NCP as 'Network Control Protocol'; the corpus says Program
    must_not_contain: ["Network Control Protocol"]
    gold_answer: |
      NCP was the Network Control Program, produced by the Network Working
      Group in 1970.

  - id: q052
    band: factual_single_hop
    question: "In what year did Licklider write the memoranda describing an 'Intergalactic Computer Network'?"
    gold_entities: ["Joseph Carl Robnett Licklider", "Bolt, Beranek and Newman"]
    answer_terms: ["1962"]
    # must_not_contain: the best-known Intergalactic memo is dated 1963; the corpus says 1962
    must_not_contain: ["1963"]
    gold_answer: |
      Licklider wrote the memoranda in 1962, while at Bolt, Beranek and Newman
      in Cambridge, Massachusetts.

  - id: q053
    band: factual_single_hop
    question: "At which institution was the second ARPANET node installed?"
    gold_entities: ["Stanford Research Institute", "Douglas Engelbart"]
    answer_terms: ["SRI"]
    # must_not_contain: SRI is routinely misnamed as Stanford University
    must_not_contain: ["Stanford University"]
    gold_answer: |
      The second node was installed at Stanford Research Institute (SRI) in
      Menlo Park, in the laboratory of Douglas Engelbart.

  - id: q054
    band: factual_single_hop
    question: "When was Bolt, Beranek and Newman awarded the contract to build the IMPs?"
    gold_entities: ["Bolt, Beranek and Newman", "IMP"]
    answer_terms: ["December", "1968"]
    # must_not_contain: many histories date the award to January 1969; the corpus says December 1968
    must_not_contain: ["January 1969"]
    gold_answer: |
      The contract was awarded to Bolt, Beranek and Newman in December 1968.

  - id: q055
    band: factual_single_hop
    question: "By when had electronic mail become responsible for the majority of the ARPANET's traffic?"
    gold_entities: ["ARPANET", "Ray Tomlinson"]
    answer_terms: ["mid-1970s"]
    # must_not_contain: the famous '1973 study' figure; 1973 is in the corpus (Kahn and Cerf), so only this check catches it
    must_not_contain: ["1973"]
    gold_answer: |
      By the mid-1970s, electronic mail was responsible for the majority of
      the ARPANET's traffic.

# ── MULTI HOP: two facts from different paragraphs ───────────────────────────

  - id: q056
    band: multi_hop
    question: "The first IMP went to the institution whose laboratory belonged to the researcher who had developed queueing theory for packet networks. On what date did it arrive, and what minicomputer was it built from?"
    gold_entities: ["IMP", "UCLA", "Leonard Kleinrock", "Honeywell DDP-516"]
    answer_terms: ["August 30", "Honeywell DDP-516"]
    # must_not_contain: the other famous UCLA date (the first message); a wrong join gives it as the arrival
    must_not_contain: ["October 29"]
    gold_answer: |
      The first IMP, a modified Honeywell DDP-516 minicomputer, was delivered
      to UCLA, home of Leonard Kleinrock's laboratory, on August 30, 1969.

  - id: q057
    band: multi_hop
    question: "Vinton Cerf moved to Stanford from another university before co-designing the Transmission Control Program. In whose laboratory at that earlier university was an ARPANET node installed?"
    gold_entities: ["Vinton Cerf", "UCLA", "Leonard Kleinrock"]
    answer_terms: ["Leonard Kleinrock"]
    # must_not_contain: joining on Stanford instead of UCLA leads to the SRI node's lab
    must_not_contain: ["Engelbart"]
    gold_answer: |
      Cerf had moved from UCLA to Stanford. The first ARPANET node was
      installed at UCLA, in the laboratory of Leonard Kleinrock.

  - id: q058
    band: multi_hop
    question: "Among the institutions where Licklider's office funded time-sharing research, which one later hosted the second ARPANET node, and whose laboratory was that node in?"
    gold_entities: ["Joseph Carl Robnett Licklider", "Stanford Research Institute", "Douglas Engelbart"]
    answer_terms: ["SRI", "Douglas Engelbart"]
    # must_not_contain: SRI misnamed as Stanford University
    must_not_contain: ["Stanford University"]
    gold_answer: |
      Licklider funded work at Stanford Research Institute (SRI), among others.
      The second ARPANET node was installed at SRI in Menlo Park, in the
      laboratory of Douglas Engelbart.

  - id: q059
    band: multi_hop
    question: "The engineer who chose the at-sign as the separator in email addresses worked for the company that built the IMP. What minicomputer was the IMP based on, and in what year did that engineer do his email work?"
    gold_entities: ["Ray Tomlinson", "Bolt, Beranek and Newman", "Honeywell DDP-516"]
    answer_terms: ["Honeywell DDP-516", "1971"]
    # must_not_contain: the at-sign is often dated to 1972; 1972 is in the corpus (1966-1972), so the number check passes it
    must_not_contain: ["1972"]
    gold_answer: |
      Ray Tomlinson did the work at BBN in 1971. BBN's IMP was a Honeywell
      DDP-516 minicomputer modified to run BBN's networking software.

  - id: q060
    band: multi_hop
    question: "The first IMP was delivered to a university where, the year before, an informal protocol group had been convened. Who convened that group, and what document series did it introduce?"
    gold_entities: ["Steve Crocker", "Network Working Group", "UCLA", "RFC series"]
    answer_terms: ["Steve Crocker", "Request for Comments"]
    # must_not_contain: the lab head at UCLA; naming him as the convener is the wrong join
    must_not_contain: ["Kleinrock"]
    gold_answer: |
      The first IMP was delivered to UCLA in 1969. The Network Working Group
      had been convened there by Steve Crocker in 1968, and it introduced the
      Request for Comments document series.

  - id: q061
    band: multi_hop
    question: "One of the two co-designers of the Transmission Control Program had been on the BBN team that built the IMP. Who was his co-designer, and in what year did the two share a Turing Award?"
    gold_entities: ["Robert Kahn", "Vinton Cerf", "Bolt, Beranek and Newman", "TCP/IP"]
    answer_terms: ["Vinton Cerf", "2004"]
    # must_not_contain: the corpus's other Turing Award year (Lamport's)
    must_not_contain: ["2013"]
    gold_answer: |
      Robert Kahn had been on the BBN IMP team; his co-designer was Vinton
      Cerf. Kahn and Cerf shared the 2004 Turing Award for the design of TCP/IP.

  - id: q062
    band: multi_hop
    question: "Which member of the team that built the IMP later worked at the agency that commissioned the ARPANET, and in what year did he begin designing a new protocol with Vinton Cerf?"
    gold_entities: ["Robert Kahn", "Bolt, Beranek and Newman", "ARPA", "Vinton Cerf"]
    answer_terms: ["Robert Kahn", "1973"]
    # must_not_contain: Licklider also went from BBN to ARPA, but was never on the IMP team
    must_not_contain: ["Licklider"]
    gold_answer: |
      Robert Kahn, a member of the BBN team that built the IMP, was by 1973
      at ARPA, where he and Vinton Cerf began designing the Transmission
      Control Program that year.

  - id: q063
    band: multi_hop
    question: "Leslie Lamport later worked at the institution that hosted the second ARPANET node. Whose laboratory hosted that node, and in what year did Lamport receive his Turing Award?"
    gold_entities: ["Leslie Lamport", "Stanford Research Institute", "Douglas Engelbart"]
    answer_terms: ["Douglas Engelbart", "2013"]
    # must_not_contain: the corpus's other Turing Award year (Kahn and Cerf's)
    must_not_contain: ["2004"]
    gold_answer: |
      Lamport later worked at SRI, where the second ARPANET node was installed
      in the laboratory of Douglas Engelbart. Lamport received the 2013 Turing
      Award.

  - id: q064
    band: multi_hop
    question: "The firm where Licklider wrote his memoranda later won the contract to build the network's switching equipment. Who led that firm's team, and to which institution was the first unit delivered?"
    gold_entities: ["Bolt, Beranek and Newman", "Frank Heart", "IMP", "UCLA"]
    answer_terms: ["Frank Heart", "UCLA"]
    # must_not_contain: Roberts led the ARPANET project, not the BBN team; the tempting wrong 'who led'
    must_not_contain: ["Lawrence Roberts"]
    gold_answer: |
      Licklider wrote the memoranda at Bolt, Beranek and Newman, which won the
      contract in December 1968. The BBN team was led by Frank Heart, and the
      first IMP was delivered to UCLA on August 30, 1969.

  - id: q065
    band: multi_hop
    question: "Leonard Kleinrock wrote his doctoral dissertation at an institution that also housed the laboratory Lawrence Roberts came from. Name that laboratory and the person who brought Roberts in to lead the project."
    gold_entities: ["Leonard Kleinrock", "MIT", "MIT Lincoln Laboratory", "Lawrence Roberts", "Robert Taylor"]
    answer_terms: ["Lincoln", "Robert Taylor"]
    # must_not_contain: Taylor's predecessor; a wrong join on 'the ARPA director'
    must_not_contain: ["Ivan Sutherland"]
    gold_answer: |
      Kleinrock's dissertation was at MIT. Lawrence Roberts came from MIT
      Lincoln Laboratory, and Robert Taylor brought him in to lead the project.

# ── FINE GRAINED DISCRIMINATION: two entities in similar roles ───────────────

  - id: q066
    band: fine_grained_discrimination
    question: "Paul Baran and Donald Davies both developed packet switching independently. Which of them built a small network to demonstrate the technique, and at which laboratory?"
    wrong_entities: ["Paul Baran"]
    gold_entities: ["Donald Davies", "National Physical Laboratory"]
    answer_terms: ["Donald Davies", "NPL"]
    gold_answer: |
      Donald Davies built a small network at the National Physical Laboratory
      (NPL) in the United Kingdom to demonstrate the technique.

  - id: q067
    band: fine_grained_discrimination
    question: "Of Paul Baran and Donald Davies, whose work was meant to let a network survive partial destruction in a nuclear exchange, and at which organisation did he work?"
    wrong_entities: ["Donald Davies"]
    gold_entities: ["Paul Baran", "RAND Corporation"]
    answer_terms: ["Paul Baran", "RAND"]
    gold_answer: |
      Paul Baran's 1964 reports at the RAND Corporation described a distributed
      adaptive message block network intended to survive partial destruction
      in a nuclear exchange.

  - id: q068
    band: fine_grained_discrimination
    question: "The first two ARPANET nodes were in the laboratories of Leonard Kleinrock and Douglas Engelbart. Whose laboratory ran the system that hosted some of the earliest networked applications, and what was it called?"
    wrong_entities: ["Leonard Kleinrock"]
    gold_entities: ["Douglas Engelbart", "NLS"]
    answer_terms: ["Douglas Engelbart", "NLS"]
    # must_not_contain: the world-knowledge name of Engelbart's lab, which the corpus never gives
    must_not_contain: ["Augmentation Research Center"]
    gold_answer: |
      Douglas Engelbart's laboratory at Stanford Research Institute ran the NLS
      system, which hosted some of the earliest networked applications.

  - id: q069
    band: fine_grained_discrimination
    question: "Steve Crocker and Abhay Bhushan both authored early RFCs. Which of them convened the Network Working Group, and in what year?"
    wrong_entities: ["Abhay Bhushan"]
    gold_entities: ["Steve Crocker", "Network Working Group"]
    answer_terms: ["Steve Crocker", "1968"]
    gold_answer: |
      Steve Crocker convened the Network Working Group, an informal body, at
      UCLA in 1968.

  - id: q070
    band: fine_grained_discrimination
    question: "Robert Kahn and Vinton Cerf began designing the Transmission Control Program together. Which of them was at ARPA at the time, and where was the other one?"
    wrong_entities: ["Vinton Cerf"]
    gold_entities: ["Robert Kahn", "ARPA"]
    answer_terms: ["Robert Kahn", "Stanford"]
    gold_answer: |
      Robert Kahn was by then at ARPA; Vinton Cerf had moved from UCLA to
      Stanford.

  - id: q071
    band: fine_grained_discrimination
    question: "Frank Heart and Robert Kahn were both on the BBN team that built the IMP. Which of them led the team?"
    wrong_entities: ["Robert Kahn"]
    gold_entities: ["Frank Heart", "Bolt, Beranek and Newman"]
    answer_terms: ["Frank Heart"]
    gold_answer: |
      Frank Heart led the BBN team; Robert Kahn, Severo Ornstein and David
      Walden were members of it.

  - id: q072
    band: fine_grained_discrimination
    question: "Robert Taylor and Lawrence Roberts both shaped the early ARPANET. Which of them incorporated Paul Baran's and Donald Davies's packet-switching work into the network's design?"
    wrong_entities: ["Robert Taylor"]
    gold_entities: ["Lawrence Roberts"]
    answer_terms: ["Lawrence Roberts"]
    gold_answer: |
      Lawrence Roberts, whom Taylor brought in to lead the project,
      incorporated both lines of work into the ARPANET design.

  - id: q073
    band: fine_grained_discrimination
    question: "Leonard Kleinrock and Douglas Engelbart each hosted one of the first two ARPANET nodes. Which of them had developed queueing theory in a doctoral dissertation, and in what year?"
    wrong_entities: ["Douglas Engelbart"]
    gold_entities: ["Leonard Kleinrock", "MIT"]
    answer_terms: ["Leonard Kleinrock", "1962"]
    # must_not_contain: Kleinrock's MIT doctorate is usually dated 1963; the corpus dates the dissertation 1962
    must_not_contain: ["1963"]
    gold_answer: |
      Leonard Kleinrock developed the queueing theory underlying packet
      networks in his 1962 MIT doctoral dissertation.

