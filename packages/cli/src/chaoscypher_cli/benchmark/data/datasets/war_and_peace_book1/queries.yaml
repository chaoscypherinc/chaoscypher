# Grounded-chat probes over War and Peace, Book One, chapters I-XIV.
#
# The corpus (~114k characters) is many times larger than what GraphRAG
# retrieval returns for one question, so the test is finding the right
# passages and answering only from them - not reading the whole text.
#
# Conventions (same as tech_encyclopedia_tiny):
# - answer_terms: the most specific words a correct concise answer names,
#   never the question's own subject. A one-word term accepts its plural or
#   possessive; a multi-word plain term is a whole phrase (scorer v5); an
#   alias group ([a, b]) is met by any one member as a whole phrase. Terms
#   are distinguishing names ('Ivánovna', not 'Márya Ivánovna', which
#   'Márya Fëdorovna' would satisfy), and since scorer v5 every term must
#   also be in the retrieved context, and an answer whose lead declines
#   about the sources fails even if it repeats the terms.
# - caveats (chat scorer v5): premises of a question the text does not state
#   (the host's name, Andrew's first name in some contexts, 'widowed'). A
#   model that answers and honestly notes one is missing has not declined.
#   An answer that opens by declining, or concludes that "the answer is not
#   in the sources", has.
# - must_not_contain: the wrong statement, matched whole and word-bounded
#   (accents folded, any whitespace between words), with no plural added and
#   its possessive matched: 'French ambassador' is stated by 'the French
#   ambassador's' (audit wave 2, 2026-10-06). A phrase starts and ends with a
#   word: punctuation inside it is matched as written ('his son, Borís'), but
#   punctuation at an end bounds nothing and a guard test refuses it (audit
#   wave 3: 'niece of Nicholas,' / 'niece of Nicholas.' let a citation, a line
#   break, a dash or the end of the answer through). Where the possessive
#   changes the referent ('niece of Nicholas' vs the right 'niece of
#   Nicholas's father'), end the phrase with the marker '|': 'niece of
#   Nicholas|' is stated by anything after the last word except its
#   possessive ('Nicholas's', "Nicholas' father").
#   An occurrence inside a negated clause states nothing (scorer v7,
#   2026-10-08): 'not for the name day' does not state 'for the name day'.
#   A phrase with its own negation, an exceptive or inner punctuation ('age
#   is not stated', 'commander beyond Schubert', 'his son, Borís') is stated
#   wherever it stands; so is one that starts with the marker '!', a wrong
#   decline whose negation the answer supplies ('!information identifying
#   which ...' is stated by 'the context does not contain information
#   identifying which ...').
# - Audit 2026-10-03: six reviewers read every question over the 21-model
#   runs; the entries marked "Audit 2026-10-03" carry the term, alias and
#   must_not_contain changes with their evidence. Open, pending Denis: q082
#   (the term repeats the question's wording and cannot fail a wrong
#   answer), q105 (two defensible answers; reword), q111 (gold may omit
#   Pierre). q088 and q129 stay strict: no mode retrieves both facts.
# - Numbers in gold answers are spelled as the text spells them; the only
#   digits are '1805'.
# - fine_grained gold_entities / wrong_entities avoid shared words ('Anna',
#   'Prince', 'Bolkónskaya'), because leads_with_gold matches any
#   significant word of either list.
# - out_of_scope decoy_entities never occur in the corpus (a test guards
#   it): they are what a model remembers from the rest of the novel, from
#   history, or from Tolstoy's life.
# - answerable: false marks an in-scope question whose fact never reaches
#   the retrieved context on the reference graph (audited 2026-10-01 with
#   internal/benchmarks/tools/audit_chat_context.py; the comment above each
#   names what is missing). Every model is guessing there, so the chat
#   probes (scorer v4) ask it, keep the answer, and leave it out of the
#   score. Retrieval is the same for every model, so this is a property of
#   the graph, not of any chat model.
# - graph_advantage (band, after q080): the leaderboard's retrieval
#   comparison, kept out of the chat column; each question carries a `kind`
#   and, until the keep rule has been applied, `candidate: true`. See the
#   band's own header below.
version: "1.1"
