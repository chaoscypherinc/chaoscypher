# ── GRAPH ADVANTAGE ─────────────────────────────────────────────────────────
# The leaderboard's "Where the graph matters" comparison: questions written
# in advance to need what a graph provides, answered under three retrieval
# rungs (naive RAG, hybrid chunk search, GraphRAG) and reported by kind.
# Never counted in the chat column (export_leaderboard.py scores the five
# bands above there); tier hard for the scorer's weighting, plain counts on
# the page.
#
# kind: cross_chapter_join - the answer joins facts stated in different
#   chapters; relationship_path - how two people are connected, through one
#   or two others; cast_aggregate - which people share a property or scene;
#   disambiguation - two people the text keeps apart by a shared name or
#   title.
#
# Keep rule (fixed before any candidate was run): a candidate is dropped
# only when no rung retrieves its answer terms (the corpus or graph cannot
# answer it at all), never because a baseline wins it. Apply it with
#   uv run python internal/benchmarks/tools/retrieval_mode_check.py
#       war_and_peace_book1 --candidates
# then delete the dropped questions, remove `candidate: true` from the kept
# ones, and record the counts here. The published set is the kept set, and
# the page reports every kept question under every rung.
# Written 2026-10-02: 56 candidates (14 per kind). Keep rule applied
# 2026-10-02 on the war_and_peace_book1-v2 pack (Gemma 4 31B extraction with
# entities merged by qwen3-embedding:4b, the product default, indexed with it,
# graphrag.vector_reserve=8): 5 were unreachable by every rung and dropped
# (q081, q091, q103, q122, q123); of the 51 kept, the first ten of each kind in
# writing order are the published set (the other eleven, q093, q094, q106, q107, q108, q119, q120, q121, q134, q135, q136,
# were set aside before any model answered them, not for how they scored).
# Earlier passes on the first graph's 0.6b, 8b and 4b indexes kept different
# forties; no model ran on those sets.
#
# answer_terms follow the conventions above; multiword terms are alias groups
# so they must match as whole phrases. must_not_contain marks the tempting
# wrong join (the other son, the other girl).

  # cross_chapter_join

  - id: q082
    band: graph_advantage
    kind: cross_chapter_join
    question: "Anna Mikháylovna wanted Prince Vasíli to recommend her son to the general Prince Andrew would serve under. Who is that general, and did Borís get a place on his staff?"
    gold_entities: ["Kutúzov", "Borís", "Anna Mikháylovna Drubetskáya", "Prince Vasíli Kurágin"]
    # chapters I and IV name the general and the request; chapter X the outcome
    # Audit 2026-10-03, decision: the old group repeated the question's words and could not fail 'yes'; the text has 'No, I won't promise that', so the answer must carry the refusal.
    # Verification 2026-10-03, round three (checked against the 5,358 real answers): fourteen correct answers said 'Borís did not receive an appointment'.
    # Verification 2026-10-03, round three (checked against the 5,358 real answers): Qwen3 8B: 'Borís did not join Kutúzov's staff'.
    # Verification 2026-10-03, round seven: a refusal to promise is not the outcome; the answer must say Borís got no place (five naive answers left the yes/no open)
    answer_terms: ["Kutúzov", ["no appointment", "not appointed", "did not get", "never", "no place", "not get a place", "did not receive", "didn't receive", "not receive", "received no", "no, he did not", "did not obtain", "was not given", "did not join", "didn't join", "not join"]]
    # Audit 2026-10-03, decision: the wrong 'yes'.
    # Verification 2026-10-03, round three (checked against the 5,358 real answers): 'got a place on' and 'obtained a place' occurred in correct answers restating the question before answering no.
    # Verification 2026-10-03, round five (301 changed real verdicts reviewed): Qwen3.8 27B (naive) left the yes/no open
    # Verification 2026-10-03, round six: Muse Glimmer (naive) left the yes/no open
    must_not_contain: ["was appointed adjutant", "became adjutant", "became an adjutant", "was made adjutant", "yes, he did", "yes, borís", "borís did get", "borís got the post", "ultimately secured is not stated", "staff appointment, is not in"]
    gold_answer: |
      General Kutúzov, whose aide-de-camp Prince Andrew is to be. Prince
      Vasíli would not promise to recommend Borís to him as adjutant, and
      Borís received no appointment to Kutúzov's staff despite all his
