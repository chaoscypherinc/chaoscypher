# Shared proxy settings for routes that do not receive a verified user identity.
include /etc/nginx/proxy-common.conf;
proxy_set_header X-Auth-User "";
# The edge token IS forwarded here: it asserts "this request transited the
# trusted nginx edge", which is true for these routes, and it is what lets
# client_ip() trust the nginx-set X-Real-IP so the auth rate limiter keys
# per client IP. Blanking it collapsed every login/setup attempt into one
# global bucket keyed to the nginx loopback peer — any LAN host could starve
# the operator's own login. The token confers no identity: every
# identity-bearing path additionally requires X-Auth-User, which stays
# blanked above. X-Real-IP itself is nginx-set from $remote_addr
# (proxy-common.conf), so clients cannot spoof it through this path.
proxy_set_header X-Auth-Edge-Token $chaoscypher_edge_auth_token;
